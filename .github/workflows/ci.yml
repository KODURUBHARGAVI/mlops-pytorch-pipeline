name: CI

# Runs the linter, the tests, and builds both images.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.6.4

      - name: Lint
        run: ruff check src tests scripts

      - name: Format check (non-blocking)
        continue-on-error: true
        run: ruff format --check src tests scripts

  test:
    name: Unit tests (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies (CPU wheels only)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Run tests
        run: pytest tests -v

  docker:
    name: Build the images
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the training image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.train
          tags: mlops-train:ci
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the serving image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.serve
          tags: mlops-serve:ci
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manifests:
    name: Check the Kubernetes files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Check
        run: kubeconform -strict -summary -ignore-missing-schemas k8s/
