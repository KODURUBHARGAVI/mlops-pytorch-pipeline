[project]
name = "mlops-pytorch-pipeline"
version = "1.0.0"
description = "PyTorch CIFAR-10 classifier packaged with Docker and deployed on Kubernetes"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "checkpoints", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]   # line length is handled by the formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]        # sys.path juggling happens in conftest.py
"src/serve.py" = ["B008"]  # FastAPI dependency defaults (File(...)) are intentional

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src", "."]
