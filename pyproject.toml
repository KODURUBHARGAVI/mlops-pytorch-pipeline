[project]
name = "mlops-pytorch-pipeline"
version = "1.0.0"
description = "PyTorch image classifier with training and serving code"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "checkpoints", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]   # line length is handled by the formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]        # conftest.py sets up the import path first
"src/serve.py" = ["B008"]  # File(...) as a default is how FastAPI works

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src", "."]
