# Part E
# Gives the two API pods one address inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: model-serving
  namespace: ml-training
  labels:
    app: model-serving
spec:
  type: ClusterIP
  selector:
    app: model-serving
  ports:
    - name: http
      protocol: TCP
      port: 80          # the port the service listens on
      targetPort: 8080  # the port inside the container
