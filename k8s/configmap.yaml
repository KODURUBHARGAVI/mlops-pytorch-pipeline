# The settings file, held in the cluster instead of inside the image.
# It is mounted into the training pod at /app/configs, so a value can be
# changed without rebuilding the image.
apiVersion: v1
kind: ConfigMap
metadata:
  name: training-config
  namespace: ml-training
  labels:
    app: model-training
data:
  training_config.yaml: |
    model:
      architecture: simple_cnn    # simple_cnn or resnet18
      num_classes: 10
      pretrained: false
    training:
      epochs: 10
      batch_size: 128
      learning_rate: 0.001
      weight_decay: 0.0001
      early_stopping_patience: 3
      seed: 42
    data:
      data_dir: ./data
      num_workers: 2
      download: true
      subset_fraction: 1.0        # 1.0 uses all the images
    output:
      checkpoint_dir: ./checkpoints
      model_name: classifier_v1.pt
