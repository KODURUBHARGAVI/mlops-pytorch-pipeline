# A template. The real secret is not committed, and .gitignore covers
# k8s/secret.yaml. Create it with:
#
#   kubectl create secret generic serving-secrets \
#     --from-literal=API_TOKEN=local-token -n ml-training
apiVersion: v1
kind: Secret
metadata:
  name: serving-secrets
  namespace: ml-training
type: Opaque
stringData:
  API_TOKEN: replace-this-value
