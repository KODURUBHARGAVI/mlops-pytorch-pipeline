# Hyperparameters for the classifier. This is the only config file.
#
# The paths below are relative, and the Docker image uses /app as its working
# directory, so "./data" means ./data locally and /app/data inside a container.
# One file works in both places.
#
# Any of these four can be overridden with an environment variable, which is
# handy for a quick test run without editing the file:
#
#   DATA_DIR  CHECKPOINT_DIR  EPOCHS  SUBSET_FRACTION
#
# Quick 2-epoch run on 15% of the data:
#   $env:EPOCHS="2"; $env:SUBSET_FRACTION="0.15"; python src\train.py

model:
  architecture: simple_cnn    # simple_cnn | resnet18
  num_classes: 10
  pretrained: false

training:
  epochs: 10
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 3
  seed: 42

data:
  dataset: fashionmnist       # fashionmnist | cifar10
  data_dir: ./data
  num_workers: 2
  download: true
  subset_fraction: 1.0        # less than 1.0 trains on a random sample

output:
  checkpoint_dir: ./checkpoints
  model_name: classifier_v1.pt
